{% extends "base.html" %}

{% block title %}Users - Discord Bot Panel{% endblock %}

{% block content %}
<div class="bg-gray-800 rounded-lg shadow-lg p-4 border border-gray-700">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">User Management</h2>
        <button id="add-user-button" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded">
            <i class="fas fa-user-plus mr-1"></i> Add User
        </button>
    </div>
    
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-gray-700">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">
                        Username
                    </th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">
                        Role
                    </th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">
                        Created
                    </th>
                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-300 uppercase tracking-wider">
                        Actions
                    </th>
                </tr>
            </thead>
            <tbody id="users-table-body" class="bg-gray-800 divide-y divide-gray-700">
                <tr>
                    <td colspan="4" class="px-6 py-4 text-center text-gray-400">
                        Loading users...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <div id="status-message" class="mt-4 hidden"></div>
</div>

<!-- Add User Modal -->
<div id="add-user-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-700 w-full max-w-md">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold">Add New User</h3>
            <button id="close-modal" class="text-gray-400 hover:text-white">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <form id="add-user-form" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-400 mb-1">Username</label>
                <input type="text" id="username" name="username" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="role" class="block text-sm font-medium text-gray-400 mb-1">Role</label>
                <select id="role" name="role" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            
            <div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Create User
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Edit User Modal -->
<div id="edit-user-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-700 w-full max-w-md">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold">Edit User</h3>
            <button id="close-edit-modal" class="text-gray-400 hover:text-white">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <form id="edit-user-form" class="space-y-4">
            <input type="hidden" id="edit-user-id">
            
            <div>
                <label for="edit-username" class="block text-sm font-medium text-gray-400 mb-1">Username</label>
                <input type="text" id="edit-username" name="username" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="edit-password" class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="edit-password" name="password" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Leave blank to keep current password">
            </div>
            
            <div>
                <label for="edit-role" class="block text-sm font-medium text-gray-400 mb-1">Role</label>
                <select id="edit-role" name="role" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            
            <div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Update User
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Get users
    async function getUsers() {
        try {
            const response = await fetch('/api/users/', {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            });
            
            if (response.ok) {
                const users = await response.json();
                
                // Update users table
                const tableBody = document.getElementById('users-table-body');
                
                if (users.length > 0) {
                    tableBody.innerHTML = '';
                    
                    users.forEach(user => {
                        const row = document.createElement('tr');
                        
                        // Format date
                        const createdDate = new Date(user.created_at);
                        const formattedDate = createdDate.toLocaleDateString() + ' ' + createdDate.toLocaleTimeString();
                        
                        row.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm text-white">${user.username}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${user.role === 'admin' ? 'bg-purple-800 text-purple-100' : 'bg-blue-800 text-blue-100'}">
                                    ${user.role}
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">
                                ${formattedDate}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <button class="edit-user-button text-blue-400 hover:text-blue-300 mr-3" data-id="${user.id}" data-username="${user.username}" data-role="${user.role}">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="delete-user-button text-red-400 hover:text-red-300" data-id="${user.id}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        `;
                        
                        tableBody.appendChild(row);
                    });
                    
                    // Add event listeners to edit and delete buttons
                    document.querySelectorAll('.edit-user-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const userId = button.getAttribute('data-id');
                            const username = button.getAttribute('data-username');
                            const role = button.getAttribute('data-role');
                            
                            // Populate edit form
                            document.getElementById('edit-user-id').value = userId;
                            document.getElementById('edit-username').value = username;
                            document.getElementById('edit-password').value = '';
                            document.getElementById('edit-role').value = role;
                            
                            // Show edit modal
                            document.getElementById('edit-user-modal').classList.remove('hidden');
                        });
                    });
                    
                    document.querySelectorAll('.delete-user-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const userId = button.getAttribute('data-id');
                            
                            if (confirm('Are you sure you want to delete this user?')) {
                                deleteUser(userId);
                            }
                        });
                    });
                } else {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="4" class="px-6 py-4 text-center text-gray-400">
                                No users found
                            </td>
                        </tr>
                    `;
                }
            } else {
                showStatusMessage('Error loading users. Please try again.', 'error');
            }
        } catch (error) {
            console.error('Error getting users:', error);
            showStatusMessage('Error loading users. Please try again.', 'error');
        }
    }
    
    // Create user
    async function createUser(username, password, role) {
        try {
            const response = await fetch('/api/users/', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    role: role
                })
            });
            
            if (response.ok) {
                showStatusMessage('User created successfully.', 'success');
                
                // Close modal and reset form
                document.getElementById('add-user-modal').classList.add('hidden');
                document.getElementById('add-user-form').reset();
                
                // Refresh users list
                getUsers();
                
                return true;
            } else {
                const error = await response.json();
                showStatusMessage(`Error creating user: ${error.detail}`, 'error');
                return false;
            }
        } catch (error) {
            console.error('Error creating user:', error);
            showStatusMessage('Error creating user. Please try again.', 'error');
            return false;
        }
    }
    
    // Update user
    async function updateUser(userId, data) {
        try {
            const response = await fetch(`/api/users/${userId}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                showStatusMessage('User updated successfully.', 'success');
                
                // Close modal and reset form
                document.getElementById('edit-user-modal').classList.add('hidden');
                document.getElementById('edit-user-form').reset();
                
                // Refresh users list
                getUsers();
                
                return true;
            } else {
                const error = await response.json();
                showStatusMessage(`Error updating user: ${error.detail}`, 'error');
                return false;
            }
        } catch (error) {
            console.error('Error updating user:', error);
            showStatusMessage('Error updating user. Please try again.', 'error');
            return false;
        }
    }
    
    // Delete user
    async function deleteUser(userId) {
        try {
            const response = await fetch(`/api/users/${userId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            });
            
            if (response.ok) {
                showStatusMessage('User deleted successfully.', 'success');
                
                // Refresh users list
                getUsers();
                
                return true;
            } else {
                const error = await response.json();
                showStatusMessage(`Error deleting user: ${error.detail}`, 'error');
                return false;
            }
        } catch (error) {
            console.error('Error deleting user:', error);
            showStatusMessage('Error deleting user. Please try again.', 'error');
            return false;
        }
    }
    
    // Show status message
    function showStatusMessage(message, type) {
        const statusElement = document.getElementById('status-message');
        statusElement.textContent = message;
        statusElement.classList.remove('hidden', 'bg-green-900', 'bg-red-900', 'bg-blue-900');
        
        if (type === 'success') {
            statusElement.classList.add('bg-green-900', 'text-white', 'p-3', 'rounded');
        } else if (type === 'error') {
            statusElement.classList.add('bg-red-900', 'text-white', 'p-3', 'rounded');
        } else {
            statusElement.classList.add('bg-blue-900', 'text-white', 'p-3', 'rounded');
        }
        
        // Hide after 5 seconds
        setTimeout(() => {
            statusElement.classList.add('hidden');
        }, 5000);
    }
    
    // Event listeners
    document.getElementById('add-user-button').addEventListener('click', function() {
        document.getElementById('add-user-modal').classList.remove('hidden');
    });
    
    document.getElementById('close-modal').addEventListener('click', function() {
        document.getElementById('add-user-modal').classList.add('hidden');
    });
    
    document.getElementById('close-edit-modal').addEventListener('click', function() {
        document.getElementById('edit-user-modal').classList.add('hidden');
    });
    
    document.getElementById('add-user-form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;
        
        if (!username || !password) {
            showStatusMessage('Username and password are required.', 'error');
            return;
        }
        
        createUser(username, password, role);
    });
    
    document.getElementById('edit-user-form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const userId = document.getElementById('edit-user-id').value;
        const username = document.getElementById('edit-username').value.trim();
        const password = document.getElementById('edit-password').value;
        const role = document.getElementById('edit-role').value;
        
        if (!username) {
            showStatusMessage('Username is required.', 'error');
            return;
        }
        
        // Build update data
        const data = {
            username: username,
            role: role
        };
        
        // Only include password if it's not empty
        if (password) {
            data.password = password;
        }
        
        updateUser(userId, data);
    });
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
        getUsers();
    });
</script>
{% endblock %}
