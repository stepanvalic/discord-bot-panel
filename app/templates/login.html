{% extends "base.html" %}

{% block title %}Login - Discord Bot Panel{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md p-8 bg-gray-800 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6 text-center">Login</h1>

    <form method="post" action="/login" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium mb-1">Username</label>
            <input type="text" id="username" name="username" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500" required>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium mb-1">Password</label>
            <input type="password" id="password" name="password" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500" required>
        </div>

        {% if error %}
        <div class="text-red-500 text-sm">{{ error }}</div>
        {% endif %}

        <button type="submit" class="w-full py-2 px-4 bg-primary-600 hover:bg-primary-700 rounded-md font-medium">
            Login
        </button>
    </form>

    <div class="mt-4 text-center text-sm">
        <a href="/register" class="text-primary-400 hover:text-primary-300">Register first user</a>
    </div>
</div>
{% endblock %}
