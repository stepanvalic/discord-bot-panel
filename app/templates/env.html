{% extends "base.html" %}

{% block title %}Environment - Discord Bot Panel{% endblock %}

{% block content %}
<div class="space-y-8">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">Environment Variables</h1>
        <button id="save-btn" class="py-2 px-4 bg-primary-600 hover:bg-primary-700 rounded-md font-medium">
            Save
        </button>
    </div>
    
    <div class="bg-gray-800 p-6 rounded-lg shadow-md">
        <h2 class="text-lg font-semibold mb-4">Bot Entrypoint</h2>
        <div class="space-y-4">
            <div>
                <label for="bot-entrypoint" class="block text-sm font-medium mb-1">Entrypoint File</label>
                <input type="text" id="bot-entrypoint" name="bot-entrypoint" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500">
            </div>
            <button id="save-entrypoint-btn" class="py-2 px-4 bg-primary-600 hover:bg-primary-700 rounded-md font-medium">
                Update Entrypoint
            </button>
        </div>
    </div>
    
    <div class="bg-gray-800 p-6 rounded-lg shadow-md">
        <h2 class="text-lg font-semibold mb-4">Environment Variables</h2>
        <div id="env-loading">Loading environment variables...</div>
        <div id="env-container" class="hidden">
            <div id="env-vars" class="space-y-4">
                <!-- Environment variables will be populated here -->
            </div>
            <div class="mt-4 flex justify-end">
                <button id="add-var-btn" class="py-2 px-4 bg-green-600 hover:bg-green-700 rounded-md font-medium">
                    Add Variable
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let envVars = {};
    
    // Function to fetch environment variables
    async function fetchEnvVars() {
        try {
            const response = await fetch('/api/env');
            
            if (response.status === 401) {
                // Unauthorized, redirect to login
                window.location.href = '/login';
                return;
            }
            
            const data = await response.json();
            
            // Update UI
            document.getElementById('env-loading').classList.add('hidden');
            document.getElementById('env-container').classList.remove('hidden');
            
            // Store environment variables
            envVars = data.variables || {};
            
            // Render environment variables
            renderEnvVars();
        } catch (error) {
            console.error('Error fetching environment variables:', error);
            document.getElementById('env-loading').textContent = 'Error loading environment variables.';
        }
    }
    
    // Function to fetch bot entrypoint
    async function fetchBotEntrypoint() {
        try {
            const response = await fetch('/api/env/entrypoint');
            
            if (response.status === 401) {
                // Unauthorized, redirect to login
                window.location.href = '/login';
                return;
            }
            
            const data = await response.json();
            
            // Update UI
            document.getElementById('bot-entrypoint').value = data.entrypoint || 'bot.py';
        } catch (error) {
            console.error('Error fetching bot entrypoint:', error);
        }
    }
    
    // Function to render environment variables
    function renderEnvVars() {
        const container = document.getElementById('env-vars');
        container.innerHTML = '';
        
        Object.entries(envVars).forEach(([key, value]) => {
            const varItem = document.createElement('div');
            varItem.className = 'grid grid-cols-12 gap-2';
            
            const keyInput = document.createElement('input');
            keyInput.type = 'text';
            keyInput.value = key;
            keyInput.className = 'col-span-4 px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500';
            keyInput.addEventListener('input', (e) => {
                const newKey = e.target.value;
                const oldKey = key;
                if (newKey !== oldKey) {
                    envVars[newKey] = envVars[oldKey];
                    delete envVars[oldKey];
                    key = newKey;
                }
            });
            
            const valueInput = document.createElement('input');
            valueInput.type = 'text';
            valueInput.value = value;
            valueInput.className = 'col-span-7 px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500';
            valueInput.addEventListener('input', (e) => {
                envVars[key] = e.target.value;
            });
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'col-span-1 bg-red-600 hover:bg-red-700 rounded-md font-medium flex items-center justify-center';
            deleteBtn.innerHTML = '&times;';
            deleteBtn.addEventListener('click', () => {
                delete envVars[key];
                renderEnvVars();
            });
            
            varItem.appendChild(keyInput);
            varItem.appendChild(valueInput);
            varItem.appendChild(deleteBtn);
            
            container.appendChild(varItem);
        });
    }
    
    // Function to add a new environment variable
    function addEnvVar() {
        envVars[`NEW_VAR_${Object.keys(envVars).length}`] = '';
        renderEnvVars();
    }
    
    // Function to save environment variables
    async function saveEnvVars() {
        try {
            const response = await fetch('/api/env', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    variables: envVars
                })
            });
            
            if (response.status === 401) {
                // Unauthorized, redirect to login
                window.location.href = '/login';
                return;
            }
            
            if (!response.ok) {
                alert('Error saving environment variables');
                return;
            }
            
            alert('Environment variables saved successfully');
        } catch (error) {
            console.error('Error saving environment variables:', error);
            alert('Error saving environment variables');
        }
    }
    
    // Function to update bot entrypoint
    async function updateBotEntrypoint() {
        try {
            const entrypoint = document.getElementById('bot-entrypoint').value;
            
            const response = await fetch('/api/env/entrypoint', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    entrypoint: entrypoint
                })
            });
            
            if (response.status === 401) {
                // Unauthorized, redirect to login
                window.location.href = '/login';
                return;
            }
            
            if (!response.ok) {
                alert('Error updating bot entrypoint');
                return;
            }
            
            alert('Bot entrypoint updated successfully');
        } catch (error) {
            console.error('Error updating bot entrypoint:', error);
            alert('Error updating bot entrypoint');
        }
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        // Fetch environment variables
        fetchEnvVars();
        
        // Fetch bot entrypoint
        fetchBotEntrypoint();
        
        // Set up button handlers
        document.getElementById('save-btn').addEventListener('click', saveEnvVars);
        document.getElementById('add-var-btn').addEventListener('click', addEnvVar);
        document.getElementById('save-entrypoint-btn').addEventListener('click', updateBotEntrypoint);
    });
</script>
{% endblock %}
