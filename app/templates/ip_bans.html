{% extends "base.html" %}

{% block title %}IP Bans{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">IP Bans</h1>
    </div>

    <div class="mt-8 bg-gray-800 p-6 rounded-lg shadow-md">
        <h2 class="text-lg font-semibold mb-4">Banned IP Addresses</h2>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="text-left border-b border-gray-700">
                        <th class="py-2 px-4">IP Address</th>
                        <th class="py-2 px-4">Failed Attempts</th>
                        <th class="py-2 px-4">Banned At</th>
                        <th class="py-2 px-4">Last Attempt</th>
                        <th class="py-2 px-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="ip-bans-table">
                    <tr>
                        <td colspan="5" class="py-4 text-center text-gray-500">Loading IP bans...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Unban IP Modal -->
<div id="unban-ip-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="bg-gray-800 p-6 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-lg font-semibold mb-4">Unban IP Address</h2>
        <div id="unban-ip-confirm">
            <p class="mb-4">Are you sure you want to unban IP <span id="unban-ip" class="font-semibold"></span>?</p>
            <div class="flex justify-end space-x-2">
                <button type="button" id="unban-ip-cancel" class="py-2 px-4 bg-gray-600 hover:bg-gray-700 rounded-md font-medium">Cancel</button>
                <button type="button" id="unban-ip-confirm-btn" class="py-2 px-4 bg-green-600 hover:bg-green-700 rounded-md font-medium">Unban</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Fetch IP bans
        fetchIPBans();

        // Set up unban IP cancel button handler
        document.getElementById('unban-ip-cancel').addEventListener('click', () => {
            document.getElementById('unban-ip-modal').classList.add('hidden');
        });
    });

    // Function to fetch IP bans
    async function fetchIPBans() {
        try {
            const response = await fetch('/api/ip-bans');

            if (response.status === 401) {
                // Unauthorized, redirect to login
                window.location.href = '/login';
                return;
            }

            if (response.status === 403) {
                // Forbidden, redirect to dashboard
                window.location.href = '/';
                return;
            }

            const data = await response.json();
            renderIPBans(data);
        } catch (error) {
            console.error('Error fetching IP bans:', error);
            document.getElementById('ip-bans-table').innerHTML = `
                <tr>
                    <td colspan="5" class="py-4 text-center text-red-500">Error loading IP bans</td>
                </tr>
            `;
        }
    }

    // Function to render IP bans
    function renderIPBans(ipBans) {
        const tableBody = document.getElementById('ip-bans-table');

        if (ipBans.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="py-4 text-center text-gray-500">No IP bans found</td>
                </tr>
            `;
            return;
        }

        tableBody.innerHTML = '';

        ipBans.forEach(ipBan => {
            const row = document.createElement('tr');
            row.className = 'border-b border-gray-700';

            // Format dates
            const bannedAt = ipBan.banned_at ? new Date(ipBan.banned_at).toLocaleString() : 'N/A';
            const lastAttempt = new Date(ipBan.last_attempt_at).toLocaleString();

            // Create cells
            const ipCell = document.createElement('td');
            ipCell.className = 'py-3 px-4';
            ipCell.textContent = ipBan.ip_address;

            const attemptsCell = document.createElement('td');
            attemptsCell.className = 'py-3 px-4';
            attemptsCell.textContent = ipBan.failed_attempts;

            const bannedAtCell = document.createElement('td');
            bannedAtCell.className = 'py-3 px-4';
            bannedAtCell.textContent = bannedAt;

            const lastAttemptCell = document.createElement('td');
            lastAttemptCell.className = 'py-3 px-4';
            lastAttemptCell.textContent = lastAttempt;

            const actionsCell = document.createElement('td');
            actionsCell.className = 'py-3 px-4';

            if (ipBan.is_banned) {
                const unbanBtn = document.createElement('button');
                unbanBtn.className = 'py-1 px-2 bg-green-600 hover:bg-green-700 rounded-md text-sm';
                unbanBtn.textContent = 'Unban';
                unbanBtn.addEventListener('click', () => showUnbanIPModal(ipBan.id, ipBan.ip_address));
                actionsCell.appendChild(unbanBtn);
            } else {
                actionsCell.textContent = 'Not banned';
            }

            // Add cells to row
            row.appendChild(ipCell);
            row.appendChild(attemptsCell);
            row.appendChild(bannedAtCell);
            row.appendChild(lastAttemptCell);
            row.appendChild(actionsCell);

            // Add row to table
            tableBody.appendChild(row);
        });
    }

    // Function to show unban IP modal
    function showUnbanIPModal(ipBanId, ipAddress) {
        currentIPBanId = ipBanId;
        document.getElementById('unban-ip').textContent = ipAddress;
        document.getElementById('unban-ip-modal').classList.remove('hidden');

        // Set up unban IP confirm button handler
        document.getElementById('unban-ip-confirm-btn').onclick = () => unbanIP(ipBanId);
    }

    // Function to unban IP
    async function unbanIP(ipBanId) {
        try {
            const response = await fetch(`/api/ip-bans/${ipBanId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    is_banned: false,
                    failed_attempts: 0
                })
            });

            if (response.status === 401) {
                // Unauthorized, redirect to login
                window.location.href = '/login';
                return;
            }

            if (response.status === 403) {
                // Forbidden, redirect to dashboard
                window.location.href = '/';
                return;
            }

            if (!response.ok) {
                const error = await response.json();
                alert(error.detail || 'Error unbanning IP');
                return;
            }

            // Hide modal
            document.getElementById('unban-ip-modal').classList.add('hidden');

            // Refresh IP bans list
            fetchIPBans();

            alert('IP unbanned successfully');
        } catch (error) {
            console.error('Error unbanning IP:', error);
            alert('Error unbanning IP');
        }
    }
</script>
{% endblock %}
