<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Discord Bot Panel{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Console colors */
        .console {
            font-family: 'Courier New', monospace;
        }

        .console .info {
            color: #38bdf8;
        }

        .console .success {
            color: #4ade80;
        }

        .console .warning {
            color: #fbbf24;
        }

        .console .error {
            color: #f87171;
        }

        .console .debug {
            color: #a78bfa;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <button id="sidebar-toggle" class="text-gray-400 hover:text-white focus:outline-none">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="text-xl font-bold">Discord Bot Panel</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-info" class="text-sm text-gray-400"></span>
                <button id="logout-button" class="text-gray-400 hover:text-white focus:outline-none">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="flex flex-1">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-gray-800 w-64 border-r border-gray-700 transition-all duration-300 ease-in-out">
            <nav class="py-4">
                <ul>
                    <li>
                        <a href="/" class="block px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-700">
                            <i class="fas fa-tachometer-alt w-6"></i> Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="/ssh-keys" class="block px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-700">
                            <i class="fas fa-key w-6"></i> SSH Keys
                        </a>
                    </li>
                    <li>
                        <a href="/webhook" class="block px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-700">
                            <i class="fas fa-webhook w-6"></i> Webhook
                        </a>
                    </li>
                    <li>
                        <a href="/files" class="block px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-700">
                            <i class="fas fa-file-code w-6"></i> File Editor
                        </a>
                    </li>
                    <li>
                        <a href="/users" class="block px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-700">
                            <i class="fas fa-users w-6"></i> Users
                        </a>
                    </li>
                    <li>
                        <a href="/env" class="block px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-700">
                            <i class="fas fa-cog w-6"></i> Environment
                        </a>
                    </li>
                    <li>
                        <a href="/bot-settings" class="block px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-700">
                            <i class="fas fa-robot w-6"></i> Bot Settings
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="flex-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-2">
        <div class="container mx-auto px-4 text-center text-gray-400 text-sm">
            Discord Bot Panel &copy; 2023
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        // Toggle sidebar
        document.getElementById('sidebar-toggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        });

        // Check authentication
        async function checkAuth() {
            // Get token from localStorage
            const token = localStorage.getItem('token');

            // If no token, redirect to login page
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch('/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('user-info').textContent = `${user.username} (${user.role})`;
                } else {
                    // Clear token and redirect to login page
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error checking authentication:', error);
                // Do not redirect to prevent infinite loop
            }
        }

        // Logout
        document.getElementById('logout-button').addEventListener('click', function() {
            localStorage.removeItem('token');
            window.location.href = '/login';
        });

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
